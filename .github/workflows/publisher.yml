# 15 dakikada bir, yalnızca yayın aralıklarında: zamanı gelmiş ve onaylı videoları Instagram'a gönderir.
# Saatler İstanbul: 13:07–15:52 (öğleden sonra) ve 19:07–20:52 (akşam). GitHub zamanlaması yoğunlukta gecikebilir; kesin dakika garantisi yok.
# Ayarlardaki yayın aralıklarını değiştirirseniz bu saatleri de güncelleyin (docs/kurulum/github-actions.md).
name: Yayın kontrolü

on:
  schedule:
    - cron: '7,22,37,52 10-12 * * *'  # 13:07–15:52 İstanbul (öğleden sonra)
    - cron: '7,22,37,52 16-17 * * *'  # 19:07–20:52 İstanbul (akşam)
    - cron: '7 13,18 * * *'           # 16:07 ve 21:07: aralık sonuna planlanan video kaçmasın
  workflow_dispatch:

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  publish:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Telegram onay/ret basışlarını uygula
        run: npx tsx src/jobs/telegram-poll.ts
      - name: Yayın
        if: success() || failure()
        run: npx tsx src/jobs/publisher.ts
