# Ses (ElevenLabs) kurulum testi: kısa bir Türkçe cümle seslendirir; anahtarın çalıştığını doğrular. Anahtar loga yazılmaz.
name: Ses testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          ffmpeg: 'true'
      - run: npx tsx src/jobs/voice-test.ts
